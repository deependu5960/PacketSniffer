[package]
name = "app"
version = "0.2.0"
description = "PacketSniffer"
authors = ["PacketSniffer"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-store = "2.5.0"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2.7.2"

